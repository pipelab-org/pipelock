name: CI flake hunter

# Nightly search for flaky tests before they red main. Main runs every race
# test once per push, so a test that fails one run in a hundred passes for days
# and then reds main for an unrelated merge. Most of those flakes were already
# in tests nobody had touched: a pull request gate on changed tests cannot see
# them. This runs the same race shards as main, from the same planner, with
# each test repeated, off-hours, and labels every failure flaky or
# deterministic by rerunning it. A red run here is a flake found early; it
# blocks nothing.

on:
  schedule:
    # 08:17 UTC is 03:17 US Eastern: away from working hours and the top of
    # the hour, when scheduled workflows queue.
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-flake-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    name: flake hunt (1.26, ${{ matrix.shard }})
    # Three repeats of a shard planned for about 15 minutes, plus reruns of
    # any failures and setup.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # Same shards as main's enterprise race lane; the enterprise build is a
        # superset of the OSS one for nearly every package.
        shard: ['proxy-0', 'proxy-1', 'proxy-2', 'proxy-3', 'proxy-4', 'proxy-5', 'proxy-6', 'proxy-7', 'proxy-8', 'scanner-0', 'scanner-1', 'scanner-2', 'scanner-3', 'scanner-4', 'mcp-0', 'mcp-1', 'mcp-2', 'mcp-3', 'mcp-4', 'mcp-5', 'mcp-6', 'mcp-7', 'runtime-0', 'runtime-1', 'rest-0', 'rest-1', 'rest-2', 'rest-3', 'rest-4', 'rest-5', 'rest-6', 'rest-7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: bash scripts/ci-retry.sh go mod download

      - name: Repeat the shard under the race detector
        env:
          CI: 'true'
          TEST_LABEL: flake hunt Go 1.26 ${{ matrix.shard }}
          TEST_SHARD: ${{ matrix.shard }}
          # Each test runs this many times in one process. The package timeout
          # is a hang detector sized for the repeats, not a performance gate.
          HUNT_COUNT: '3'
        run: |
          set -o pipefail
          set +e
          packages="$(python3 scripts/ci_test_packages.py --tags enterprise --shard "$TEST_SHARD")" || exit $?
          test_selector="$(python3 scripts/ci_test_packages.py --shard "$TEST_SHARD" --selector)" || exit $?
          package_parallelism=2
          if [[ "$TEST_SHARD" == proxy-* ]]; then
            package_parallelism=1
          fi
          # shellcheck disable=SC2086 # packages is a space-separated list
          go test -tags enterprise -race -p="$package_parallelism" -parallel=2 -timeout=90m -count="$HUNT_COUNT" \
            ${test_selector:+"$test_selector"} -json $packages \
            | python3 scripts/stream_go_test_json.py --label "$TEST_LABEL" --json-out /tmp/go-test-hunt.json
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            timeout 1500 python3 scripts/ci_flake_report.py --tags enterprise --reruns 10 --label "$TEST_LABEL" \
              < /tmp/go-test-hunt.json \
              || echo "::warning title=Failure classification incomplete::the rerun of failed tests did not finish"
          fi
          exit "$test_status"

      - name: Upload failing run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-json-${{ matrix.shard }}
          path: /tmp/go-test-hunt.json
          retention-days: 14
          if-no-files-found: ignore
