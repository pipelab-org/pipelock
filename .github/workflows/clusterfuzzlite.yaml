name: ClusterFuzzLite
on:
  pull_request:
    branches: [main, 'release-base/**']
    paths:
      # ClusterFuzzLite builds Go fuzzers from source. Keep this advisory,
      # expensive job tied to code, module, corpus, and fuzzer-build inputs.
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/testdata/fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/clusterfuzzlite.yaml'
permissions:
  contents: read
jobs:
  PR:
    runs-on: ubuntu-latest
    # Corpus artifact lookups count against wall time as well as the 300s
    # fuzz budget. Keep the previous 30-minute ceiling so those lookups do not
    # cancel the job before every target runs.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: go
          fuzz-seconds: 300
          mode: 'code-change'
