name: CI shard drift

# Weekly check that the race shards still fit the CI time budget. New slow
# tests land without anyone re-measuring the shards, which is how CI crept from
# about fifteen minutes to over thirty before. This rebuilds the shard weights
# from the latest successful main run's go test timings and fails when they
# predict any shard over budget, attaching the refreshed weights file for the
# rebalancing PR. It only reads: the repository token cannot push or open a PR
# here, and a PR opened with it would not run CI anyway.

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  drift:
    name: Shard budget from main's timings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Download main's shard timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo "::error title=No main CI run::found no successful main CI run to measure"
            exit 1
          fi
          echo "measuring CI run $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'go-test-json-*-go126-*' \
            --dir "$RUNNER_TEMP/timing"
          count="$(find "$RUNNER_TEMP/timing" -name '*.json' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error title=No timings::CI run $run_id kept no go-test-json artifacts"
            exit 1
          fi
          echo "downloaded $count timing files"

      - name: Refresh weights and check the budget
        run: |
          set -uo pipefail
          python3 scripts/ci_test_durations.py --write --ci-artifacts "$RUNNER_TEMP/timing" || exit $?
          status=0
          {
            echo '## CI shard drift'
            echo
            echo 'Predicted test seconds per shard from the refreshed weights.'
            echo
            echo '```'
            python3 scripts/ci_test_packages.py --check-budget || status=1
            python3 scripts/ci_test_packages.py --tags enterprise --check-budget || status=1
            echo '```'
            echo
            git diff --stat -- scripts/ci_test_durations.json
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          if [ "$status" -ne 0 ]; then
            echo "::error title=CI shard over budget::a shard is predicted over budget; commit the attached ci_test_durations.json and rebalance TEST_SPLITS in scripts/ci_test_packages.py"
          fi
          exit "$status"

      - name: Find tests nearing the per-test ceiling
        # CI fails any top-level race test over 300s (TEST_CEILING_SECONDS in
        # ci.yaml), and a test that crept past it turned main red. Flag one at
        # 180s, 60% of the ceiling, while there is still room for runner
        # variance, so it gets split before it reds main.
        if: ${{ !cancelled() }}
        env:
          EARLY_CEILING_SECONDS: '180'
        run: |
          set -uo pipefail
          status=0
          if [ -z "$(find "$RUNNER_TEMP/timing" -name '*.json' -print -quit 2>/dev/null)" ]; then
            echo "::error title=No timings::no go test timing files to check; this step must not pass on an empty scan"
            exit 1
          fi
          while IFS= read -r -d '' file; do
            # A zero-byte or non-event file passes the directory check and the
            # summarizer exits 0 on it. That is an empty scan and must not pass.
            if [ ! -s "$file" ] || ! grep -q '"Action"' "$file"; then
              echo "::error title=Timing file empty::$file has no go test events; an empty scan must not pass"
              status=1
              continue
            fi
            out="$(python3 scripts/summarize_go_test_json.py --top 1 --top-tests 1 \
              --allow-failed-packages --max-test-seconds "$EARLY_CEILING_SECONDS" < "$file")"
            rc=$?
            if [ "$rc" -eq 3 ]; then
              # Keep only the per-test annotations, which name each test.
              printf '%s\n' "$out" | grep '^::error' || true
              status=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error title=Timing file unreadable::$file could not be summarized (exit $rc)"
              status=1
            fi
          done < <(find "$RUNNER_TEMP/timing" -name '*.json' -print0)
          if [ "$status" -ne 0 ]; then
            echo "::error title=Tests nearing the ceiling::split or speed up the tests named above before they pass the 300s ceiling and red main"
          fi
          exit "$status"

      - name: Upload refreshed weights
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test-durations
          path: scripts/ci_test_durations.json
          retention-days: 30
