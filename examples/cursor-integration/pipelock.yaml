# Minimal valid config for pipelock cursor hook demos in this example.
# Installed hooks embed this path via: pipelock cursor install --config pipelock.yaml

version: 1
mode: balanced

dlp:
  include_defaults: true

mcp_input_scanning:
  enabled: true
  action: block

response_scanning:
  enabled: true
  action: block
  include_defaults: true

mcp_tool_policy:
  enabled: true
  action: block
  rules:
    - name: "Destructive File Delete"
      tool_pattern: '(?i)^(?:(?:mcp__[a-z0-9_-]+__|[a-z0-9_-]+[.:]))?(bash|shell|exec|run_command|execute|terminal|bash_exec)$'
      arg_pattern: '(?i)\brm(?:\s+[^\s;|&]+)*?\s+(-[a-z]*[rf][a-z]*\b|--(?:recursive|force)\b)'
      action: block
    - name: "Credential File Access"
      tool_pattern: '(?i)^(?:(?:mcp__[a-z0-9_-]+__|[a-z0-9_-]+[.:]))?(bash|shell|exec|run_command|execute|terminal|bash_exec|read_file|file_read|read_text_file|read_media_file|read_multiple_files|head_file|tail_file|batch_read|create_symlink|create_hardlink|move_file|file_move|rename_file|move-file|copy_file|file_copy)$'
      arg_pattern: '(?i)(\.ssh[\\/]?(?:id_[a-z0-9_-]*(?:$|[^a-z0-9_.-]|\.(?:$|[^p]|p(?:$|[^u]|u(?:$|[^b]|b[\s\S]))))|authorized)|\.aws[\\/]?credentials|\.env\b|\.netrc|/etc/shadow)'
      action: block
    - name: "Reverse Shell"
      tool_pattern: '(?i)^(?:(?:mcp__[a-z0-9_-]+__|[a-z0-9_-]+[.:]))?(bash|shell|exec|run_command|execute|terminal|bash_exec)$'
      arg_pattern: '(?i)((?:^|[\s;|&()<>\x60\x22\x27/=])bash\s+-i\s+>&|/dev/tcp/|(?:^|[\s;|&()<>\x60\x22\x27/=])mkfifo\s+|(?:^|[\s;|&()<>\x60\x22\x27/=])nc\s+-e|(?:^|[\s;|&()<>\x60\x22\x27/=])ncat\s+-e|(?:^|[\s;|&()<>\x60\x22\x27/=])(?:nc|ncat|netcat)(?:\s+[^\s;|&]+)*?\s+-[a-z0-9]*e\b|(?:^|[\s;|&()<>\x60\x22\x27/=])(?:nc|ncat|netcat)(?:\s+[^\s;|&]+)*?\s+((?-i:-[a-z0-9]*c)\b|--(?:sh-|lua-)?exec\b)|(?:^|[\s;|&()<>\x60\x22\x27/=])bash(?:\s+-[a-z]+)*?\s+-[a-z]*i[a-z]*(?:\s+-[a-z]+)*?\s+>&|/dev/udp/)'
      action: block
